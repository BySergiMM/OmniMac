name: Compilar

on:
  push:
    branches: [main]
  pull_request:

# El GITHUB_TOKEN de este flujo solo necesita leer el repositorio para
# descargarlo; sin este bloque hereda los permisos por defecto del repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compilar (release)
        run: swift build -c release
      - name: Tests
        run: swift test
